name: Validate Learning Flywheel

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
    paths:
      - '.claude/skills/**'
      - 'plugins/**/skills/**'
      - 'scripts/validate_memory.py'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '.claude/skills/**'
      - 'plugins/**/skills/**'
      - 'scripts/validate_memory.py'

jobs:
  validate-skills:
    name: Validate SKILL.md Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run skill validator
        run: |
          python scripts/validate_memory.py --strict

      - name: Check for skills
        id: check_skills
        run: |
          SKILL_COUNT=$(find .claude/skills -name "SKILL.md" 2>/dev/null | wc -l)
          echo "skill_count=$SKILL_COUNT" >> $GITHUB_OUTPUT
          echo "Found $SKILL_COUNT skills"

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && steps.check_skills.outputs.skill_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const skillCount = '${{ steps.check_skills.outputs.skill_count }}';
            const comment = `### 🧠 Learning Flywheel Report

            ✅ All skills validated successfully!

            **Skills in repository:** ${skillCount}

            Keep building that institutional memory! 🚀`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  check-negative-knowledge:
    name: Verify Negative Knowledge Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for failure documentation
        run: |
          SKILLS=$(find .claude/skills -name "SKILL.md" 2>/dev/null)

          if [ -z "$SKILLS" ]; then
            echo "No skills found - skipping negative knowledge check"
            exit 0
          fi

          MISSING_NEG_KNOWLEDGE=0

          for skill in $SKILLS; do
            if ! grep -qi "negative knowledge\|failed attempts" "$skill"; then
              echo "⚠️  Missing Negative Knowledge: $skill"
              MISSING_NEG_KNOWLEDGE=$((MISSING_NEG_KNOWLEDGE + 1))
            fi
          done

          if [ $MISSING_NEG_KNOWLEDGE -gt 0 ]; then
            echo "❌ $MISSING_NEG_KNOWLEDGE skill(s) missing Negative Knowledge documentation"
            echo "Add 'Negative Knowledge' or 'Failed Attempts' section to document learnings"
            exit 1
          fi

          echo "✅ All skills document negative knowledge"

  context-budget-check:
    name: Check Context Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          MAX_LINES=500
          OVERSIZED=0

          SKILLS=$(find .claude/skills -name "SKILL.md" 2>/dev/null)

          if [ -z "$SKILLS" ]; then
            echo "No skills found - skipping context budget check"
            exit 0
          fi

          for skill in $SKILLS; do
            LINES=$(wc -l < "$skill")
            if [ $LINES -gt $MAX_LINES ]; then
              echo "⚠️  Exceeds context budget ($LINES/$MAX_LINES lines): $skill"
              OVERSIZED=$((OVERSIZED + 1))
            fi
          done

          if [ $OVERSIZED -gt 0 ]; then
            echo "❌ $OVERSIZED skill(s) exceed context budget"
            echo "Move detailed documentation to reference.md files"
            exit 1
          fi

          echo "✅ All skills within context budget ($MAX_LINES lines)"

  drift-detection:
    name: Detect Stale Skills (Drift Detection)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git log analysis

      - name: Check for stale skills
        run: |
          STALE_THRESHOLD_DAYS=180
          CURRENT_DATE=$(date +%s)
          STALE_SKILLS=0

          echo "🔍 Checking for skills not modified in ${STALE_THRESHOLD_DAYS} days..."
          echo ""

          SKILLS=$(find .claude/skills -name "SKILL.md" 2>/dev/null)

          if [ -z "$SKILLS" ]; then
            echo "No skills found - skipping drift detection"
            exit 0
          fi

          for skill in $SKILLS; do
            # Get last commit date for this file
            LAST_MODIFIED=$(git log -1 --format=%ct "$skill" 2>/dev/null || echo "0")

            if [ "$LAST_MODIFIED" -eq "0" ]; then
              echo "⚠️  [NEW] $skill (not yet committed)"
              continue
            fi

            DAYS_SINCE_MODIFIED=$(( ($CURRENT_DATE - $LAST_MODIFIED) / 86400 ))

            if [ $DAYS_SINCE_MODIFIED -gt $STALE_THRESHOLD_DAYS ]; then
              echo "⏰ [STALE] $skill (last modified ${DAYS_SINCE_MODIFIED} days ago)"
              STALE_SKILLS=$((STALE_SKILLS + 1))
            fi
          done

          echo ""
          if [ $STALE_SKILLS -gt 0 ]; then
            echo "⚠️  Found $STALE_SKILLS stale skill(s)"
            echo "📝 ACTION: Update 'last_verified' field or archive to prevent Context Rot"
            echo "   Stale skills may contain outdated information that degrades agent performance"
          else
            echo "✅ All skills are fresh (modified within ${STALE_THRESHOLD_DAYS} days)"
          fi

      - name: Comment drift report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const STALE_THRESHOLD_DAYS = 180;
            const skills = execSync('find .claude/skills -name "SKILL.md" 2>/dev/null || true').toString().trim().split('\n').filter(Boolean);

            if (skills.length === 0) {
              console.log('No skills found');
              return;
            }

            let staleSkills = [];
            const currentDate = Math.floor(Date.now() / 1000);

            for (const skill of skills) {
              try {
                const lastModified = parseInt(execSync(`git log -1 --format=%ct "${skill}" 2>/dev/null || echo "0"`).toString().trim());
                const daysSinceModified = Math.floor((currentDate - lastModified) / 86400);

                if (lastModified > 0 && daysSinceModified > STALE_THRESHOLD_DAYS) {
                  staleSkills.push({ path: skill, days: daysSinceModified });
                }
              } catch (e) {
                console.log(`Could not check ${skill}: ${e.message}`);
              }
            }

            if (staleSkills.length > 0) {
              let comment = `### ⏰ Drift Detection Report\n\n`;
              comment += `Found **${staleSkills.length}** stale skill(s) (not modified in >${STALE_THRESHOLD_DAYS} days):\n\n`;

              staleSkills.forEach(s => {
                comment += `- \`${s.path}\` - ${s.days} days old\n`;
              });

              comment += `\n**Action Required:** Update \`last_verified\` field or archive these skills to prevent "Context Rot".\n`;
              comment += `Stale skills may contain outdated information that degrades agent performance.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  skill-statistics:
    name: Generate Skill Statistics
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for statistics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate statistics
        run: |
          python scripts/validate_memory.py --stats

      - name: Upload statistics
        uses: actions/upload-artifact@v4
        with:
          name: skill-statistics
          path: |
            .claude/skills/**/*.md
          retention-days: 30

  verify-skills:
    name: Execute Skill Verification Tests (Proof of Correctness)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run skill verification tests
        id: verify
        run: |
          python scripts/verify_skills.py --report verification-report.json --verbose
        continue-on-error: true

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
          retention-days: 30

      - name: Comment verification report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const report = JSON.parse(fs.readFileSync('verification-report.json', 'utf8'));
              const summary = report.summary;

              let comment = `### 🧪 Skill Verification Report\n\n`;

              // Summary table
              comment += `| Metric | Count |\n`;
              comment += `|--------|-------|\n`;
              comment += `| Total Skills | ${summary.total_skills} |\n`;
              comment += `| ✅ Verified | ${summary.verified} |\n`;
              comment += `| ❌ Failed | ${summary.failed} |\n`;
              comment += `| ⚠️ No Verification | ${summary.no_verification} |\n`;

              // Calculate rates
              const verificationCoverage = summary.total_skills > 0
                ? ((summary.verified + summary.failed) / summary.total_skills * 100).toFixed(1)
                : 0;
              const successRate = summary.total_skills > 0
                ? (summary.verified / summary.total_skills * 100).toFixed(1)
                : 0;

              comment += `\n**Verification Coverage:** ${verificationCoverage}%\n`;
              comment += `**Success Rate:** ${successRate}%\n\n`;

              // Show failed skills
              if (summary.failed > 0) {
                comment += `\n#### ❌ Failed Verifications\n\n`;
                report.skills.filter(s => s.test_passed === false).forEach(skill => {
                  comment += `- **${skill.name}**: ${skill.error ? skill.error.substring(0, 100) : 'Test failed'}...\n`;
                });
                comment += `\n**Action Required:** Fix failing verifications before merging.\n`;
              }

              // Show skills without verification
              if (summary.no_verification > 0) {
                comment += `\n#### ⚠️ Skills Without Verification\n\n`;
                report.skills.filter(s => !s.has_verification).forEach(skill => {
                  comment += `- ${skill.name}\n`;
                });
                comment += `\n**Recommendation:** Add verification tests to prevent Context Rot.\n`;
              }

              // Success message
              if (summary.failed === 0 && summary.verified > 0) {
                comment += `\n✅ **All skill verifications passed!** Your skills are proven to work.\n`;
              }

              comment += `\n---\n*Verification tests prove skills work through executable code, preventing "Context Rot".*`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not read verification report:', e.message);
            }

      - name: Fail if verifications failed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "❌ Skill verification tests failed"
          exit 1
